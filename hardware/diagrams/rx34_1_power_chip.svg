<rect x="516" y="108" width="160" height="112" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
<text x="526" y="129" font-size="11.5" font-weight="700" fill="#212529">ชิปเดียวทำสองช่อง</text>
<text x="526" y="147" font-size="11.5" font-weight="400" fill="#212529">ขา 1-7 (ซ้าย) = ช่อง 3</text>
<text x="526" y="165" font-size="11.5" font-weight="400" fill="#212529">ขา 8-14 (ขวา) = ช่อง 4</text>
<text x="526" y="183" font-size="11.5" font-weight="400" fill="#212529">อยู่ไดเดียวกัน</text>
<text x="526" y="201" font-size="11.5" font-weight="400" fill="#212529">แมตช์ดีกว่าคนละชิป</text>
<rect x="516" y="310" width="160" height="112" rx="6" fill="#fff5f5" stroke="#e03131"/>
<text x="526" y="331" font-size="11.5" font-weight="700" fill="#212529">ต้องต่อสะพานรางซ้าย-ขวา</text>
<text x="526" y="349" font-size="11.5" font-weight="400" fill="#212529">ทั้งราง + และราง −</text>
<text x="526" y="367" font-size="11.5" font-weight="400" fill="#212529">เพราะช่อง 3 ลงรางซ้าย</text>
<text x="526" y="385" font-size="11.5" font-weight="400" fill="#212529">ช่อง 4 ลงรางขวา</text>
<text x="526" y="403" font-size="11.5" font-weight="400" fill="#212529">ลืมข้อนี้ = ช่อง 4 ไม่มีกราวด์</text>
<rect x="516" y="480" width="160" height="112" rx="6" fill="#fff4e6" stroke="#f08c00"/>
<text x="526" y="501" font-size="11.5" font-weight="700" fill="#212529">VREF ต้องมาจาก</text>
<text x="526" y="519" font-size="11.5" font-weight="400" fill="#212529">ตัวแบ่งเดียวของบอร์ด RX</text>
<text x="526" y="537" font-size="11.5" font-weight="400" fill="#212529">ห้ามสร้างตัวแบ่งใหม่</text>
<text x="526" y="555" font-size="11.5" font-weight="400" fill="#212529">ไม่งั้นสี่ช่องอยู่คนละเรฟ</text>
<text x="526" y="573" font-size="11.5" font-weight="400" fill="#212529">แล้วมุมเพี้ยนทั้งหมด</text>
