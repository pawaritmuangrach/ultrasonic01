<text x="570" y="147" font-size="11.5" font-weight="400" fill="#212529">ขนานได้ 23.5Ω</text>
<text x="570" y="165" font-size="11.5" font-weight="400" fill="#212529">กระแสพีค 130 mA</text>
<text x="570" y="183" font-size="11.5" font-weight="400" fill="#212529">เกินพิกัด 50 mA ของชิป</text>
<text x="570" y="201" font-size="11.5" font-weight="400" fill="#212529">ถึง 2.6 เท่า</text>
