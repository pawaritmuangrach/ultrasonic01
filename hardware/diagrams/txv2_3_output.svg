<text x="570" y="301" font-size="11.5" font-weight="700" fill="#212529">47+47 = 94Ω กระแสพีค 46 mA</text>
<text x="570" y="319" font-size="11.5" font-weight="400" fill="#212529">แถว 37 คือจุดต่อระหว่าง</text>
<text x="570" y="337" font-size="11.5" font-weight="400" fill="#212529">R สองตัว — 37G กับ 37H</text>
<text x="570" y="355" font-size="11.5" font-weight="400" fill="#212529">อยู่แถวเดียวฝั่งเดียวกัน</text>
<text x="570" y="373" font-size="11.5" font-weight="400" fill="#212529">จึงถึงกันใต้บอร์ดอยู่แล้ว</text>
