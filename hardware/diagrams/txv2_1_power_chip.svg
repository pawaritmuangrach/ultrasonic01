<text x="570" y="129" font-size="11.5" font-weight="700" fill="#212529">ไฟเลี้ยง 5V ไม่ใช่ 3.3V</text>
<text x="570" y="147" font-size="11.5" font-weight="400" fill="#212529">74HCT04 ที่ 5V เท่านั้น</text>
<text x="570" y="165" font-size="11.5" font-weight="400" fill="#212529">ที่ 3.3V จะขับไม่แรงพอ</text>
<text x="570" y="183" font-size="11.5" font-weight="400" fill="#212529">และ VIH ไม่ผ่าน</text>
<rect x="560" y="260" width="170" height="94" rx="6" fill="#fff5f5" stroke="#e03131"/>
<text x="570" y="281" font-size="11.5" font-weight="700" fill="#212529">ต้องเป็น HCT ไม่ใช่ HC</text>
<text x="570" y="299" font-size="11.5" font-weight="400" fill="#212529">HC ที่ 5V ต้องการ</text>
<text x="570" y="317" font-size="11.5" font-weight="400" fill="#212529">VIH 3.5V แต่ ESP32</text>
<text x="570" y="335" font-size="11.5" font-weight="400" fill="#212529">ให้แค่ 3.3V</text>
<rect x="560" y="400" width="170" height="112" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
<text x="570" y="421" font-size="11.5" font-weight="700" fill="#212529">ขา 11 กับ 13 คืออินพุต</text>
<text x="570" y="439" font-size="11.5" font-weight="400" fill="#212529">ของเกตที่ไม่ได้ใช้</text>
<text x="570" y="457" font-size="11.5" font-weight="400" fill="#212529">ปล่อยลอย = ชิปกินกระแส</text>
<text x="570" y="475" font-size="11.5" font-weight="400" fill="#212529">หลาย mA และแกว่งเอง</text>
<text x="570" y="493" font-size="11.5" font-weight="400" fill="#212529">รบกวนภาครับที่เกน 121</text>
<rect x="560" y="550" width="170" height="94" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
<text x="570" y="571" font-size="11.5" font-weight="700" fill="#212529">กราวด์ของบอร์ดนี้</text>
<text x="570" y="589" font-size="11.5" font-weight="400" fill="#212529">ใช้ขา GND ของ ESP32</text>
<text x="570" y="607" font-size="11.5" font-weight="400" fill="#212529">คนละขากับบอร์ด RX</text>
<text x="570" y="625" font-size="11.5" font-weight="400" fill="#212529">จุดรวมอยู่ในตัว DevKit</text>
