<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="Segoe UI, system-ui, sans-serif" fill="#343a40">
<title>ภาพตัดขวางข้อต่อระหว่างดุมกับแขน</title>
<desc>รูเป็นรูผ่านเรียบไม่มีเกลียว สกรู M3 สอดจากด้านบนผ่านลิ้นแขนหนา 2 มิลลิเมตรและพื้นเบ้าของดุมหนา 2 มิลลิเมตร แล้วขันด้วยนอตจากด้านล่าง</desc>
<rect width="680" height="400" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="700" fill="#1971c2">ข้อต่อดุม–แขน — ภาพตัดขวางตามแนวรัศมี</text>
<text x="20" y="48" font-size="12" fill="#6c757d">รูไม่มีเกลียว · แรงยึดมาจากนอต ไม่ใช่จากเนื้อพลาสติก</text>

<rect x="60.0" y="156.0" width="88.0" height="44.0" fill="#e9ecef" stroke="#868e96" stroke-width="1.5"/>
<rect x="148.0" y="178.0" width="165.0" height="22.0" fill="#e9ecef" stroke="#868e96" stroke-width="1.5"/>
<rect x="148.0" y="156.0" width="165.0" height="22.0" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<rect x="313.0" y="156.0" width="110.0" height="44.0" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>

<rect x="164.5" y="156.0" width="33.0" height="44.0" fill="#ced4da" stroke="#495057" stroke-width="1.5"/>
<rect x="150.8" y="134.0" width="60.5" height="22.0" rx="2" fill="#adb5bd" stroke="#343a40" stroke-width="1.5"/>
<rect x="142.5" y="200.0" width="77.0" height="6.6" fill="#dee2e6" stroke="#495057" stroke-width="1.2"/>
<rect x="150.8" y="206.6" width="60.5" height="26.4" fill="#868e96" stroke="#343a40" stroke-width="1.5"/>
<text x="181.0" y="251.0" font-size="11" text-anchor="middle" fill="#6c757d">r = 56</text>

<rect x="263.5" y="156.0" width="33.0" height="44.0" fill="#ced4da" stroke="#495057" stroke-width="1.5"/>
<rect x="249.8" y="134.0" width="60.5" height="22.0" rx="2" fill="#adb5bd" stroke="#343a40" stroke-width="1.5"/>
<rect x="241.5" y="200.0" width="77.0" height="6.6" fill="#dee2e6" stroke="#495057" stroke-width="1.2"/>
<rect x="249.8" y="206.6" width="60.5" height="26.4" fill="#868e96" stroke="#343a40" stroke-width="1.5"/>
<text x="280.0" y="251.0" font-size="11" text-anchor="middle" fill="#6c757d">r = 65</text>

<text x="82.0" y="182.0" font-size="12" fill="#495057">ดุม</text>
<text x="357.0" y="182.0" font-size="12" fill="#1971c2">แขน</text>

<line x1="434.0" y1="156.0" x2="530" y2="156.0" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="434.0" y1="178.0" x2="530" y2="178.0" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="434.0" y1="200.0" x2="530" y2="200.0" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 3"/>
<text x="536" y="171.0" font-size="12" fill="#1971c2">ลิ้นแขน 2 มม.</text>
<text x="536" y="193.0" font-size="12" fill="#495057">พื้นเบ้าดุม 2 มม.</text>
<text x="536" y="148.0" font-size="12" font-weight="600" fill="#343a40">รวม 4 มม. เท่าเนื้อแผ่น</text>

<line x1="181.0" y1="132.0" x2="111.0" y2="90" stroke="#495057" stroke-width="1" stroke-dasharray="4 3"/>
<text x="105.0" y="88" font-size="13" font-weight="600" text-anchor="end" fill="#343a40">สกรู M3 × 8</text>
<line x1="280.0" y1="230.0" x2="370.0" y2="330" stroke="#495057" stroke-width="1" stroke-dasharray="4 3"/>
<text x="376.0" y="334" font-size="13" font-weight="600" fill="#343a40">แหวนรอง + นอต M3</text>

<text x="20" y="368" font-size="12" fill="#e03131">พลาสติกหนาแค่ 2 มม. ต่อชั้น — ตัดเกลียว M3 ต้องการเนื้ออย่างน้อย 4.5 มม. ถึงจะไม่รูด</text>
</svg>