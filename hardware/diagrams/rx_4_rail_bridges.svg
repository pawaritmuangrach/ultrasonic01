<svg xmlns="http://www.w3.org/2000/svg" width="680" height="716" viewBox="0 0 680 716" font-family="Segoe UI, system-ui, sans-serif" fill="#343a40">
<title>ต่อสะพานข้ามช่องว่างกลางรางไฟทั้งสี่ราง</title>
<desc>บอร์ดทดลอง 60 แถว รางไฟถูกตัดขาดตรงกลางระหว่างแถว 30 กับ 31 ครึ่งบนมีไฟจาก ESP32 ครึ่งล่างไม่มีไฟ ต้องเสียบจัมเปอร์สั้นข้ามช่องว่างทั้งสี่ราง</desc>
<rect x="0" y="0" width="680" height="716" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="700" fill="#1971c2">ผังภาครับ 4 — สะพานข้ามช่องว่างกลางราง</text>
<text x="20" y="48" font-size="12" fill="#6c757d">ต้นเหตุของฮัม 50 Hz ที่ทำให้วงจรชนรางเต็ม ต้องต่อทั้งสี่รางเสมอ</text>
<g transform="translate(0,56)">
