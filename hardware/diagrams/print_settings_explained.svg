<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="Segoe UI, system-ui, sans-serif" fill="#343a40">
<title>ค่าพิมพ์สามตัว ชั้น ผนัง และอินฟิล</title>
<desc>ภาพซ้ายแสดงว่าชิ้นงานถูกสร้างเป็นชั้นแนวนอนชั้นละ 0.2 มิลลิเมตร ภาพขวาแสดงว่าในหนึ่งชั้นมีเส้นผนังเดินรอบขอบสี่เส้นและมีลายอินฟิลอยู่ข้างใน</desc>
