<text x="20" y="48" font-size="12" fill="#6c757d">หัวฉีดรีดพลาสติกเส้นกว้าง 0.4 มม. เดินไปมาทีละชั้น จากล่างขึ้นบน</text>
<text x="40" y="92" font-size="14" font-weight="600">ชั้น (layer) = 0.2 มม.</text>
