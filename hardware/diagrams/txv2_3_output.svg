<text x="570" y="451" font-size="11.5" font-weight="700" fill="#212529">หัวส่งต้องเป็นตัว T</text>
<text x="570" y="469" font-size="11.5" font-weight="400" fill="#212529">ไม่ใช่ R</text>
<text x="570" y="487" font-size="11.5" font-weight="400" fill="#212529">อ่านตัวอักษรบนกระป๋อง</text>
<text x="570" y="505" font-size="11.5" font-weight="400" fill="#212529">ไม่มีขั้ว สลับขาได้</text>
<text x="570" y="523" font-size="11.5" font-weight="400" fill="#212529">ถ้ามี R 100Ω ตัวเดียว ใช้ 34G→40G</text>
