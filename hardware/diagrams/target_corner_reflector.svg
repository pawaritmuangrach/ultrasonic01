<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Tahoma, sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="30" y="40" font-size="23" font-weight="700" fill="#1971c2">มุมสะท้อน — หันด้านเว้าเข้าหาเซ็นเซอร์</text>
<text x="30" y="64" font-size="13.5" fill="#868e96">สามแผ่นตั้งฉากกันทั้งสามคู่ มาเจอกันที่จุดเดียว · ด้านละ 15 cm</text>

<rect x="28" y="86" width="420" height="378" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text x="46" y="114" font-size="15.5" font-weight="700" fill="#2f9e44">มองตรงเข้าไปในมุม — นี่คือสิ่งที่เซ็นเซอร์เห็น</text>
<g transform="translate(238,285)">
  <polygon points="0.0,0.0 0.0,-118.0 -102.2,-59.0 -102.2,59.0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2.5"/>
  <polygon points="0.0,0.0 -102.2,59.0 0.0,118.0 102.2,59.0" fill="#8ce99a" stroke="#2f9e44" stroke-width="2.5"/>
  <polygon points="0.0,0.0 102.2,59.0 102.2,-59.0 0.0,-118.0" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2.5"/>
  <line x1="0" y1="0" x2="0.0" y2="-118.0" stroke="#2f9e44" stroke-width="3"/>
  <line x1="0" y1="0" x2="-102.2" y2="59.0" stroke="#2f9e44" stroke-width="3"/>
  <line x1="0" y1="0" x2="102.2" y2="59.0" stroke="#2f9e44" stroke-width="3"/>
  <circle cx="0" cy="0" r="7" fill="#2f9e44"/>
  <text x="14" y="-8" font-size="13" font-weight="700" fill="#2f9e44">มุมยอด</text>
  <text x="14" y="9" font-size="11" fill="#495057">(อยู่ลึกที่สุด)</text>
  <text x="-150" y="-70" font-size="12.5" fill="#495057">แผ่น 1</text>
  <text x="-16" y="150" font-size="12.5" fill="#495057">แผ่น 2</text>
  <text x="112" y="-70" font-size="12.5" fill="#495057">แผ่น 3</text>
</g>
<text x="238" y="440" font-size="12.5" text-anchor="middle" fill="#2f9e44">เห็นเป็นหกเหลี่ยม มีเส้นสามเส้นวิ่งออกจากจุดกลาง</text>

<rect x="468" y="86" width="504" height="180" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
<text x="486" y="114" font-size="15.5" font-weight="700" fill="#2f9e44">✓ ถูก — ด้านเว้าหันเข้า</text>
<g transform="translate(700,190)">
  <path d="M60,-58 L0,0 L60,58" fill="none" stroke="#2f9e44" stroke-width="5"/>
  <path d="M-210,-26 L20,-26" stroke="#e03131" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M20,-26 L46,0 L20,26" fill="none" stroke="#e03131" stroke-width="2.5"/>
  <path d="M20,26 L-210,26" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#ag)"/>
  <rect x="-250" y="-18" width="34" height="36" rx="5" fill="#495057"/>
  <text x="-233" y="40" font-size="11.5" text-anchor="middle" fill="#495057">เซ็นเซอร์</text>
  <text x="-150" y="-34" font-size="12" fill="#e03131">เสียงเข้า</text>
  <text x="-160" y="46" font-size="12" fill="#2f9e44">กลับมาครบ</text>
</g>

<rect x="468" y="284" width="504" height="180" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
<text x="486" y="312" font-size="15.5" font-weight="700" fill="#e03131">✗ ผิด — ด้านแหลมหันเข้า</text>
<g transform="translate(700,388)">
  <path d="M-10,-58 L50,0 L-10,58" fill="none" stroke="#e03131" stroke-width="5"/>
  <path d="M-210,-26 L-14,-26" stroke="#e03131" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M-14,-26 L-100,-72" stroke="#adb5bd" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M-14,-26 L60,-70" stroke="#adb5bd" stroke-width="2" marker-end="url(#agr)"/>
  <path d="M-14,-26 L80,20" stroke="#adb5bd" stroke-width="2" marker-end="url(#agr)"/>
  <rect x="-250" y="-18" width="34" height="36" rx="5" fill="#495057"/>
  <text x="-233" y="40" font-size="11.5" text-anchor="middle" fill="#495057">เซ็นเซอร์</text>
  <text x="-10" y="80" font-size="12" fill="#e03131">กระเจิงทิ้งทุกทาง แทบไม่กลับมา</text>
</g>
<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e03131"/></marker>
<marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f9e44"/></marker>
<marker id="agr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#adb5bd"/></marker>
</defs>

<rect x="28" y="486" width="944" height="130" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
<text x="46" y="514" font-size="15.5" font-weight="700" fill="#f08c00">วิธีทำจากกล่องพัสดุ</text>
<text x="46" y="542" font-size="13" fill="#343a40">1. หามุมด้านในของกล่อง จุดที่ผนังสองด้านมาเจอพื้น — ตรงนั้นตั้งฉากกันครบสามคู่อยู่แล้ว</text>
<text x="46" y="565" font-size="13" fill="#343a40">2. วัดจากมุมนั้นออกไป 15 cm ตามขอบทั้งสามเส้น แล้วตัดกล่องทิ้งส่วนที่เหลือ</text>
<text x="46" y="588" font-size="13" fill="#343a40">3. เอาปากที่เปิดหันเข้าหาเซ็นเซอร์ ให้มุมยอดอยู่ไกลสุด — ถ้ามองแล้วเห็นด้านในทั้งสามแผ่น แปลว่าหันถูก</text>
<text x="46" y="609" font-size="12" fill="#868e96">ระวังอย่าให้มุมบุบหรือเบี้ยว ถ้าไม่ตั้งฉาก 90° เสียงจะไม่กลับทางเดิม — ใช้เทปกาวเสริมมุมให้แข็ง</text>
</svg>