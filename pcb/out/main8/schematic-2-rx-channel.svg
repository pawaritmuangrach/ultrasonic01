<text x="60" y="860" font-family="Tahoma, Arial, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start">10nF ที่ทางเข้า ตัดไฟตรงทิ้ง เหลือแต่คลื่นเสียง แล้ว 1M ดึงระดับกลางไปไว้ที่ VREF เพราะวงจรใช้ไฟเลี้ยงขั้วเดียว</text>
<text x="60" y="884" font-family="Tahoma, Arial, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start">ถ้าไม่ดึงไว้กลางทาง คลื่นครึ่งล่างจะถูกตัดหายไปทันที</text>
<text x="60" y="908" font-family="Tahoma, Arial, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start">1k + 1nF ปลายทาง ตัดความถี่เหนือ 159 kHz ทิ้งก่อนเข้า ADC กันสัญญาณความถี่สูงย้อนกลับมาโผล่เป็นคลื่นปลอม</text>
