<g font-size="12" text-anchor="end" fill="#6c757d"><text x="190" y="96">แถว 1</text><text x="190" y="318">แถว 30</text><text x="190" y="372">แถว 31</text><text x="190" y="600">แถว 60</text></g>
<text x="20" y="150" font-size="14" font-weight="600" fill="#343a40">ครึ่งบน — มีไฟ</text>
<g font-size="12" fill="#6c757d"><text x="20" y="176">3V3 และ GND จาก ESP32 เสียบอยู่ตรงนี้</text><text x="20" y="196">ชิป MCP6004 อยู่แถว 20-26</text><text x="20" y="216">ขา 4 และขา 11 จึงได้ไฟครบ ชิปทำงานปกติ</text></g>
<text x="20" y="450" font-size="14" font-weight="600" fill="#e03131">ครึ่งล่าง — ถ้าไม่ต่อสะพาน จะไม่มีไฟเลย</text>
<g font-size="12" fill="#e03131"><text x="20" y="476">ตัวแบ่ง VREF 10k/10k แถว 44</text><text x="20" y="496">C 10µF แถว 44-46</text><text x="20" y="516">Cg1 แถว 33 · Cg2 แถว 45 · C_out แถว 36</text><text x="20" y="536">คาปาบายพาสของชิป แถว 44 และ 46</text></g>
<g font-size="12" fill="#6c757d"><text x="20" y="562">ทั้งหมดนี้จะต่ออยู่กับโลหะที่ลอย</text><text x="20" y="582">แล้วกลายเป็นเสาอากาศรับไฟบ้าน</text></g>
<text x="500" y="322" font-size="14" font-weight="600" fill="#e8590c">ช่องว่างกลางราง</text>
<g font-size="12" fill="#e8590c"><text x="500" y="346">รางบนกับรางล่าง</text><text x="500" y="366">ไม่ได้ต่อถึงกัน</text></g>
<text x="500" y="420" font-size="14" font-weight="600" fill="#1971c2">สิ่งที่ต้องทำ</text>
<g font-size="12" fill="#1971c2"><text x="500" y="446">เสียบจัมเปอร์สั้น 4 เส้น</text><text x="500" y="466">ข้ามช่องว่างทุกราง</text></g>
<g font-size="12" fill="#343a40"><text x="500" y="492">แดงต่อแดง</text><text x="500" y="512">น้ำเงินต่อน้ำเงิน</text></g>
<text x="500" y="538" font-size="12" fill="#6c757d">ห้ามต่อข้ามสี</text>
</g></svg>