<text x="444" y="358" font-size="11" text-anchor="start" font-weight="700" fill="#e03131">วัดที่นี่</text>
<circle cx="430" cy="354" r="4.5" fill="#e03131"/>
<rect x="524" y="96" width="330" height="148" rx="6" fill="#e7f5ff" stroke="#1971c2"/>
<text x="534" y="117" font-size="11.5" font-weight="700" fill="#212529">ต่อ 6 จุด (ดูหมายเลขขาบนชิป)</text>
<text x="534" y="135" font-size="11.5" font-weight="400" fill="#212529">1. ขา 4 (VDD)  ->  ราง +  (สายแดง)</text>
<text x="534" y="153" font-size="11.5" font-weight="400" fill="#212529">2. ขา 11 (VSS) ->  ราง -  (สายดำ)</text>
<text x="534" y="171" font-size="11.5" font-weight="400" fill="#212529">3. R1 10k : ราง +  ->  จุดกลาง</text>
<text x="534" y="189" font-size="11.5" font-weight="400" fill="#212529">4. R2 10k : จุดกลาง  ->  ราง -</text>
<text x="534" y="207" font-size="11.5" font-weight="400" fill="#212529">5. จุดกลาง  ->  ขา 10 (อินพุต +)</text>
<text x="534" y="225" font-size="11.5" font-weight="400" fill="#212529">6. ขา 8 (เอาต์)  ->  ขา 9 (ป้อนกลับ)</text>
<rect x="524" y="256" width="330" height="94" rx="6" fill="#ebfbee" stroke="#2f9e44"/>
<text x="534" y="277" font-size="11.5" font-weight="700" fill="#212529">วัดผล : สายดำที่ราง -  วัดที่ขา 8</text>
<text x="534" y="295" font-size="11.5" font-weight="400" fill="#212529">~1.65V  = ชิปดี (เอาต์ตามอินพุต)</text>
<text x="534" y="313" font-size="11.5" font-weight="400" fill="#212529">ค้าง 0 หรือ 3.3 / ไม่ตาม = ชิปพัง</text>
<text x="534" y="331" font-size="11.5" font-weight="400" fill="#212529">R1 R2 ต้องเป็น 10k เท่ากันทั้งคู่</text>
<rect x="524" y="356" width="330" height="94" rx="6" fill="#fff4e6" stroke="#f08c00"/>
<text x="534" y="377" font-size="11.5" font-weight="700" fill="#212529">เทสเร็ว (ไม่ต้องใช้ R เลย)</text>
<text x="534" y="395" font-size="11.5" font-weight="400" fill="#212529">เอาขา 10 แตะราง + -> ขา 8 ควร ~3.3</text>
<text x="534" y="413" font-size="11.5" font-weight="400" fill="#212529">เอาขา 10 แตะราง - -> ขา 8 ควร ~0</text>
<text x="534" y="431" font-size="11.5" font-weight="400" fill="#212529">เอาต์วิ่งตามที่แตะ = ชิปดี</text>
<rect x="524" y="456" width="330" height="112" rx="6" fill="#f8f0fc" stroke="#ae3ec9"/>
<text x="534" y="477" font-size="11.5" font-weight="700" fill="#212529">ข่าวดี</text>
<text x="534" y="495" font-size="11.5" font-weight="400" fill="#212529">MCP6024 ขาเหมือน MCP6004 เป๊ะ</text>
<text x="534" y="513" font-size="11.5" font-weight="400" fill="#212529">และเร็วกว่า (10MHz เทียบ 1MHz)</text>
<text x="534" y="531" font-size="11.5" font-weight="400" fill="#212529">ถ้าตัวนี้ผ่านเทส เอาเข้าผัง 2 ได้เลย</text>
<text x="534" y="549" font-size="11.5" font-weight="400" fill="#212529">ไม่ต้องหา MCP6004 มาแทน</text>
</svg>